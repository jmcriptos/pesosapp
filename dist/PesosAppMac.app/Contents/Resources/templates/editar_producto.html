<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
</head>
<body>
    <h1>Editar Producto</h1>
    
    <form method="POST">
        <label for="nombre">Nombre del Producto:</label>
        <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required><br>

        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" name="descripcion" value="{{ producto.descripcion }}"><br>

        <label for="temperatura">Temperatura de Almacenamiento:</label>
        <input type="text" id="temperatura" name="temperatura" value="{{ producto.temperatura }}"><br>

        <button type="submit">Guardar Cambios</button>
    </form>
    <footer class="ip-footer">
        <p>© 2024 Jomar Foods, BV. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
