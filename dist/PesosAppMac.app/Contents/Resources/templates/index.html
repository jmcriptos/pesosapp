<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Inventario</title>
        <!-- Favicon -->
        <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
        <!-- CSS personalizado -->
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <!-- Font Awesome para los iconos -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>
    
<body>
    <h1>Gestión de Inventario</h1>
    <div class="icon-grid">
        <a href="/productos" class="icon-container icon-productos">
            <i class="fas fa-box"></i>
            <span class="icon-label">Productos</span>
        </a>
        <a href="/clientes" class="icon-container icon-clientes">
            <i class="fas fa-users"></i>
            <span class="icon-label">Clientes</span>
        </a>
        <a href="/recepciones" class="icon-container icon-recepciones">
            <i class="fas fa-truck"></i>
            <span class="icon-label">Recepciones</span>
        </a>
        <a href="/facturacion" class="icon-container icon-facturacion">
            <i class="fas fa-file-invoice-dollar"></i>
            <span class="icon-label">Facturación</span>
        </a>
        <a href="/etiquetas_vencimiento" class="icon-container icon-etiquetas">
            <i class="fas fa-tags"></i>
            <span class="icon-label">Etiquetas</span>
        </a>
        <!-- Nuevo icono para el formulario de importación -->
        <a href="/formulario_importacion" class="icon-container icon-importacion">
            <i class="fas fa-file-alt"></i>
            <span class="icon-label">Importación</span>
        </a>
    </div>
    
    <div class="ip-footer">
        <p>La aplicación está disponible en la IP: {{ server_ip }}</p>
    </div>
</body>
</html>
