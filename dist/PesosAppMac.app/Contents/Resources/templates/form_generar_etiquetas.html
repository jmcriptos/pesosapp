<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Etiquetas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Incluye Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Botón para regresar a la página de inicio -->
    <a href="/" style="position: absolute; top: 20px; left: 20px; color: red;">
        <i class="fas fa-home fa-2x"></i>
    </a>
    <h1>Generar Etiquetas de Vencimiento</h1>
    <section>
        <form method="POST" action="{{ url_for('etiquetas_vencimiento') }}">
            <div class="form-group">
                <label for="producto_id" class="form-label">Producto:</label>
                <select name="producto_id" id="producto_id" class="form-input">
                    {% for producto in productos %}
                        <option value="{{ producto.id }}">{{ producto.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fecha_fabricacion" class="form-label">Fecha de Fabricación:</label>
                <input type="date" name="fecha_fabricacion" id="fecha_fabricacion" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="lote" class="form-label">Lote:</label>
                <input type="text" name="lote" id="lote" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="cantidad_etiquetas" class="form-label">Cantidad de Etiquetas:</label>
                <input type="number" name="cantidad_etiquetas" id="cantidad_etiquetas" class="form-input" value="8" required>
            </div>
            <button type="submit" class="form-button">Generar PDF</button>
        </form>
    </section>
</body>
</html>
