<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Incluye jQuery desde un CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Incluye Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="flash-message" id="flash-message"></div>

    <!-- Botón para regresar a la página de inicio -->
    <a href="/" style="position: absolute; top: 20px; left: 20px; color: red;">
        <i class="fas fa-home fa-2x"></i> 
    </a>
    <h1>
        <!-- Icono de Font Awesome dentro del h1 -->
        <i class="fas fa-box" style="color: #ff6f61; margin-right: 10px;"></i> Productos
    </h1>
    <div id="flash-message" class="flash-message" style="display: none;"></div>
    <section>
        <h2>Registrar Producto</h2>
        <form id="form-crear-producto" method="POST" action="{{ url_for('crear_producto') }}">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" name="nombre" required>
            
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion">
            
            <label for="temperatura">Temperatura:</label>
            <input type="text" id="temperatura" name="temperatura">
            
            <button type="submit">Crear Producto</button>
        </form>
    </section>
    
    <!-- Sección para mostrar productos registrados -->
    <section>
        <h2>Productos Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Temperatura</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for producto in productos %}
                <tr id="producto-{{ producto.id }}">
                    <td>{{ producto.id }}</td>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.descripcion }}</td>
                    <td>{{ producto.temperatura }}</td>
                    <td>
                        <button class="eliminar-producto" data-id="{{ producto.id }}">Eliminar</button>
                    </td>                                                          
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
