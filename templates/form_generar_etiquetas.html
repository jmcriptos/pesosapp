{% extends "base.html" %}

{% block title %}Generar Etiquetas{% endblock %}

{% block header_title %}
    <span class="fw-700 color-white">
        Generar Etiquetas
    </span>
    <br>
    <small class="fs-08 color-white" style="opacity:0.8; font-weight:normal;">
        Etiquetas de vencimiento
    </small>
{% endblock %}

{% block content %}
<div class="mobile-form-container">
    <form method="POST" id="form-etiquetas" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Producto Card -->
        <div class="mobile-card">
            <div class="mobile-card-header">
                <i class="fas fa-tags"></i>
                Datos de la etiqueta
            </div>
            <div class="mobile-card-body">
                <div class="mobile-form-group">
                    <label class="mobile-form-label" for="producto_id">Producto:</label>
                    <select name="producto_id" id="producto_id" class="mobile-form-control ts-select" required>
                        <option value="">Seleccione un producto</option>
                        {% for producto in productos %}
                        <option value="{{ producto.id }}">{{ producto.nombre }} - {{ producto.codigo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mobile-form-group">
                    <label class="mobile-form-label" for="fecha_fabricacion">Fecha de Fabricación:</label>
                    <input type="date" name="fecha_fabricacion" id="fecha_fabricacion"
                           class="mobile-form-control" required>
                </div>

                <div class="mobile-form-group">
                    <label class="mobile-form-label" for="lote">Número de Lote:</label>
                    <input type="text" name="lote" id="lote"
                           class="mobile-form-control"
                           placeholder="Ej: LOTE-2025-001" required>
                </div>

                <div class="mobile-form-group">
                    <label class="mobile-form-label" for="cantidad_etiquetas">Cantidad de etiquetas:</label>
                    <input type="number" name="cantidad_etiquetas" id="cantidad_etiquetas"
                           class="mobile-form-control"
                           min="1" max="100" value="1" required>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="mobile-form-actions">
            <a href="{{ url_for('productos') }}" class="mobile-btn mobile-btn-secondary">
                <i class="fas fa-times"></i>
                Cancelar
            </a>
            <button type="submit" class="mobile-btn mobile-btn-primary">
                <i class="fas fa-print"></i>
                Generar Etiquetas
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const cantidadInput = document.getElementById('cantidad_etiquetas');

    document.getElementById('form-etiquetas').addEventListener('submit', function(e) {
        const cantidad = parseInt(cantidadInput.value);
        if (cantidad < 1 || cantidad > 100) {
            e.preventDefault();
            alert('La cantidad debe estar entre 1 y 100');
            cantidadInput.focus();
        }
    });

    cantidadInput.addEventListener('input', function() {
        const valor = parseInt(this.value);
        if (valor > 100) this.value = 100;
        else if (valor < 1) this.value = 1;
    });
});
</script>
{% endblock %}
