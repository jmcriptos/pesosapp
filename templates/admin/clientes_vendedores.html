{% extends "base.html" %}
{% block title %}Asignar Cliente a Vendedor{% endblock %}

{% block content %}
<div class="card shadow-lg p-4 mx-auto" style="max-width:900px">

  <form id="form-asignar" method="POST" action="{{ url_for('asignar_cliente') }}" class="row g-3">

      <!-- ---------- Vendedor ---------- -->
      <div class="col-md-6">
          <label for="vendedor_id" class="form-label">Vendedor</label>
          <select id="vendedor_id" name="vendedor_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for v in vendedores %}
                  <option value="{{ v.id }}">{{ v.nombre_completo }}</option>
              {% endfor %}
          </select>
      </div>

      <!-- ---------- Cliente ---------- -->
      <div class="col-md-6">
          <label for="cliente_id" class="form-label">Cliente sin asignar</label>
          <select id="cliente_id" name="cliente_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for c in clientes_sin_asignar %}
                  <option value="{{ c.id }}">{{ c.nombre }}</option>
              {% endfor %}
          </select>
      </div>

      <div class="col-12">
        <button class="btn btn-primary w-100">
            <i class="fas fa-plus-circle"></i> Asignar
        </button>
      </div>
  </form>

  <!-- ===== Tabla dinámica de clientes del vendedor ===== -->
  <hr class="my-4">
  <h5>Clientes asignados</h5>
  <div class="table-responsive">
      <table id="tabla-clientes" class="table table-striped align-middle">
          <thead>
              <tr>
                  <th style="width:70%">Cliente</th>
                  <th style="width:30%">Acciones</th>
              </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
      </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
{{ super() }}
<script>
// Listener para cuando cambia el vendedor seleccionado
document.getElementById('vendedor_id').addEventListener('change', function() {
    cargarClientesAsignados();
    actualizarClientesDisponibles();
});

// Función para cargar los clientes asignados al vendedor en la tabla
async function cargarClientesAsignados() {
    const vendedorId = document.getElementById('vendedor_id').value;
    const tbody = document.querySelector('#tabla-clientes tbody');
    
    // Mostrar loading
    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Cargando...</td></tr>';

    // Si no hay vendedor seleccionado, limpiar tabla
    if (!vendedorId) {
        tbody.innerHTML = '';
        return;
    }

    try {
        // Cargar clientes asignados al vendedor
        const res = await fetch(`/api/vendedores/${vendedorId}/clientes`);
        
        if (!res.ok) {
            throw new Error(`Error HTTP: ${res.status}`);
        }
        
        const datos = await res.json();

        // Limpiar tabla
        tbody.innerHTML = '';

        if (!datos.length) {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Sin clientes asignados</td></tr>';
            return;
        }

        // Dibujar filas de clientes asignados
        datos.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${c.nombre}</td>
              <td>
                 <button class="btn btn-sm btn-outline-danger" data-asign="${c.asign_id}" title="Desasignar cliente">
                     <i class="fas fa-unlink"></i> Desasignar
                 </button>
              </td>`;
            tbody.appendChild(tr);
        });
    } catch (error) {
        console.error('Error al cargar clientes asignados:', error);
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Error al cargar datos</td></tr>';
    }
}

// Función para actualizar la lista de clientes disponibles (sin asignar)
async function actualizarClientesDisponibles() {
    const clienteSelect = document.getElementById('cliente_id');
    
    // Mostrar loading en el select
    clienteSelect.innerHTML = '<option value="">Cargando clientes...</option>';
    
    try {
        // Obtener clientes sin asignar
        const res = await fetch('/api/clientes/sin-asignar');
        
        if (!res.ok) {
            throw new Error(`Error HTTP: ${res.status}`);
        }
        
        const clientes = await res.json();

        // Limpiar select
        clienteSelect.innerHTML = '<option value="">— Seleccione —</option>';

        // Agregar opciones de clientes disponibles
        clientes.forEach(cliente => {
            const option = document.createElement('option');
            option.value = cliente.id;
            option.textContent = cliente.nombre;
            clienteSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error al cargar clientes disponibles:', error);
        clienteSelect.innerHTML = '<option value="">Error al cargar clientes</option>';
    }
}

// Listener para desasignar clientes
document.querySelector('#tabla-clientes').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-asign]');
    if (!btn) return;

    if (!confirm('¿Estás seguro de que quieres desasignar este cliente?')) return;

    // Deshabilitar botón durante la operación
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';

    try {
        const asignId = btn.dataset.asign;
        const resp = await fetch(`/api/asignaciones/${asignId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const json = await resp.json();

        if (json.success) {
            // Remover la fila
            btn.closest('tr').remove();
            
            // Actualizar clientes disponibles
            actualizarClientesDisponibles();
            
            // Mostrar mensaje de éxito
            mostrarMensaje('Cliente desasignado correctamente', 'success');
        } else {
            mostrarMensaje('Error: ' + (json.error || 'No se pudo desasignar'), 'error');
            // Restaurar botón
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-unlink"></i> Desasignar';
        }
    } catch (error) {
        console.error('Error al desasignar:', error);
        mostrarMensaje('Error de conexión al desasignar cliente', 'error');
        // Restaurar botón
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-unlink"></i> Desasignar';
    }
});

// Función para mostrar mensajes
function mostrarMensaje(mensaje, tipo = 'info') {
    // Remover mensaje anterior si existe
    const mensajeAnterior = document.querySelector('.mensaje-temporal');
    if (mensajeAnterior) {
        mensajeAnterior.remove();
    }
    
    const tipoClass = tipo === 'success' ? 'alert-success' : 
                     tipo === 'error' ? 'alert-danger' : 'alert-info';
    
    const flashDiv = document.createElement('div');
    flashDiv.className = `alert ${tipoClass} alert-dismissible fade show mensaje-temporal`;
    flashDiv.innerHTML = `
        ${mensaje}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    // Insertar al inicio de la card
    document.querySelector('.card').prepend(flashDiv);
    
    // Auto-dismiss después de 5 segundos
    setTimeout(() => {
        if (flashDiv.parentNode) {
            flashDiv.remove();
        }
    }, 5000);
}

// Listener para el formulario de asignación
document.getElementById('form-asignar').addEventListener('submit', function(e) {
    const vendedorId = document.getElementById('vendedor_id').value;
    const clienteId = document.getElementById('cliente_id').value;
    
    if (!vendedorId || !clienteId) {
        e.preventDefault();
        mostrarMensaje('Debe seleccionar un vendedor y un cliente', 'error');
        return;
    }
    
    // El formulario se envía normalmente (se recargará la página)
    // Opcional: mostrar loading en el botón de envío
    const submitBtn = this.querySelector('button[type="submit"]');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Asignando...';
    }
});

// Cargar datos iniciales al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    // Si hay un vendedor pre-seleccionado, cargar sus clientes
    const vendedorSelect = document.getElementById('vendedor_id');
    if (vendedorSelect.value) {
        cargarClientesAsignados();
    }
    
    // Cargar clientes disponibles
    actualizarClientesDisponibles();
});
</script>
{% endblock %}
