{% extends "base.html" %}
{% block title %}Asignar Cliente a Vendedor{% endblock %}

{% block content %}
<div class="card shadow-lg p-4 mx-auto" style="max-width:900px">

  <form id="form-asignar" method="POST" action="{{ url_for('asignar_cliente') }}" class="row g-3">

      <!-- ---------- Vendedor ---------- -->
      <div class="col-md-6">
          <label for="vendedor_id" class="form-label">Vendedor</label>
          <select id="vendedor_id" name="vendedor_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for v in vendedores %}
                  <option value="{{ v.id }}">{{ v.nombre_completo }}</option>
              {% endfor %}
          </select>
      </div>

      <!-- ---------- Cliente ---------- -->
      <div class="col-md-6">
          <label for="cliente_id" class="form-label">Cliente sin asignar</label>
          <select id="cliente_id" name="cliente_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for c in clientes_sin_asignar %}
                  <option value="{{ c.id }}">{{ c.nombre }}</option>
              {% endfor %}
          </select>
      </div>

      <div class="col-12">
        <button class="btn btn-primary w-100" type="submit">
            <i class="fas fa-plus-circle"></i> Asignar
        </button>
      </div>
  </form>

  <!-- ===== Tabla dinámica de clientes del vendedor ===== -->
  <hr class="my-4">
  <h5>Clientes asignados</h5>
  <div class="table-responsive">
      <table id="tabla-clientes" class="table table-striped align-middle">
          <thead>
              <tr>
                  <th style="width:70%">Cliente</th>
                  <th style="width:30%">Acciones</th>
              </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
      </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
console.log('🚀 SCRIPT INICIADO - Funcionando correctamente');

document.addEventListener('DOMContentLoaded', function() {
    console.log('=== PÁGINA CARGADA ===');
    
    const vendedorSelect = document.getElementById('vendedor_id');
    const formAsignar = document.getElementById('form-asignar');
    
    if (vendedorSelect) {
        vendedorSelect.addEventListener('change', async function() {
            const vendedorId = this.value;
            const vendedorNombre = this.options[this.selectedIndex].text;
            
            console.log('Vendedor seleccionado:', vendedorNombre, 'ID:', vendedorId);
            
            if (!vendedorId) {
                document.querySelector('#tabla-clientes tbody').innerHTML = '';
                return;
            }
            
            await cargarClientes(vendedorId);
        });
    }
    
    // Manejar envío del formulario
    if (formAsignar) {
        formAsignar.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const vendedorId = document.getElementById('vendedor_id').value;
            const clienteId = document.getElementById('cliente_id').value;
            
            if (!vendedorId || !clienteId) {
                alert('Por favor selecciona vendedor y cliente');
                return;
            }
            
            try {
                const res = await fetch('/api/asignaciones', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        vendedor_id: parseInt(vendedorId),
                        cliente_id: parseInt(clienteId)
                    })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    console.log('✅ Cliente asignado correctamente');
                    
                    // Limpiar el select de cliente
                    document.getElementById('cliente_id').value = '';
                    
                    // Recargar tabla del vendedor
                    await cargarClientes(vendedorId);
                    
                    // Actualizar clientes disponibles
                    await actualizarClientesDisponibles();
                    
                    alert('Cliente asignado correctamente');
                } else {
                    console.error('Error en asignación:', result.error);
                    alert('Error al asignar cliente: ' + result.error);
                }
                
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Error de conexión al asignar cliente');
            }
        });
    }
    
    // Actualizar clientes disponibles al cargar
    actualizarClientesDisponibles();
});

async function cargarClientes(vendedorId) {
    const tbody = document.querySelector('#tabla-clientes tbody');
    tbody.innerHTML = '<tr><td colspan="2" class="text-center">Cargando...</td></tr>';
    
    try {
        console.log('Consultando API:', `/api/vendedores/${vendedorId}/clientes`);
        const res = await fetch(`/api/vendedores/${vendedorId}/clientes`);
        
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }
        
        const datos = await res.json();
        console.log('Datos recibidos:', datos);
        
        tbody.innerHTML = '';
        
        if (!datos.length) {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Sin clientes asignados</td></tr>';
            return;
        }
        
        datos.forEach(cliente => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${cliente.nombre}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="desasignar(${cliente.asign_id})" title="Desasignar cliente">
                        <i class="fas fa-unlink"></i> Desasignar
                    </button>
                </td>`;
            tbody.appendChild(tr);
        });
        
        console.log(`✅ Tabla actualizada con ${datos.length} clientes`);
        
    } catch (error) {
        console.error('❌ Error al cargar clientes:', error);
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Error al cargar datos</td></tr>';
    }
}

async function actualizarClientesDisponibles() {
    try {
        const res = await fetch('/api/clientes/sin-asignar');
        const clientes = await res.json();
        
        const select = document.getElementById('cliente_id');
        select.innerHTML = '<option value="">— Seleccione —</option>';
        
        clientes.forEach(cliente => {
            const option = document.createElement('option');
            option.value = cliente.id;
            option.textContent = cliente.nombre;
            select.appendChild(option);
        });
        
        console.log(`Clientes disponibles actualizados: ${clientes.length}`);
        
    } catch (error) {
        console.error('Error cargando clientes disponibles:', error);
    }
}

async function desasignar(asignId) {
    if (!confirm('¿Estás seguro de que quieres desasignar este cliente?')) {
        return;
    }
    
    try {
        const res = await fetch(`/api/asignaciones/${asignId}`, { 
            method: 'DELETE' 
        });
        
        if (res.ok) {
            console.log('✅ Cliente desasignado');
            
            // Recargar tabla del vendedor actual
            const vendedorId = document.getElementById('vendedor_id').value;
            if (vendedorId) {
                await cargarClientes(vendedorId);
            }
            
            // Actualizar clientes disponibles
            await actualizarClientesDisponibles();
            
            alert('Cliente desasignado correctamente');
        } else {
            const error = await res.json();
            alert('Error al desasignar: ' + (error.error || 'Error desconocido'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error de conexión al desasignar cliente');
    }
}
</script>
{% endblock %}
