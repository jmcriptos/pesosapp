{% extends "base.html" %}
{% block title %}Asignar Cliente a Vendedor{% endblock %}

{% block content %}
<div class="card shadow-lg p-4 mx-auto" style="max-width:900px">

  <form id="form-asignar" method="POST" action="{{ url_for('asignar_cliente') }}" class="row g-3">

      <!-- ---------- Vendedor ---------- -->
      <div class="col-md-6">
          <label for="vendedor_id" class="form-label">Vendedor</label>
          <select id="vendedor_id" name="vendedor_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for v in vendedores %}
                  <option value="{{ v.id }}">{{ v.nombre_completo }}</option>
              {% endfor %}
          </select>
      </div>

      <!-- ---------- Cliente ---------- -->
      <div class="col-md-6">
          <label for="cliente_id" class="form-label">Cliente sin asignar</label>
          <select id="cliente_id" name="cliente_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for c in clientes_sin_asignar %}
                  <option value="{{ c.id }}">{{ c.nombre }}</option>
              {% endfor %}
          </select>
      </div>

      <div class="col-12">
        <button class="btn btn-primary w-100">
            <i class="fas fa-plus-circle"></i> Asignar
        </button>
      </div>
  </form>

  <!-- ===== Tabla dinámica de clientes del vendedor ===== -->
  <hr class="my-4">
  <h5>Clientes asignados</h5>
  <div class="table-responsive">
      <table id="tabla-clientes" class="table table-striped align-middle">
          <thead>
              <tr>
                  <th style="width:70%">Cliente</th>
                  <th style="width:30%">Acciones</th>
              </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
      </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
{{ super() }}
<script>
// DEBUGGING: Verificar que el script se carga
console.log('🚀 SCRIPT INICIADO - Version 1.0');
alert('JavaScript cargado correctamente'); // Esto debería aparecer al cargar la página

// Listener para cuando cambia el vendedor seleccionado
document.getElementById('vendedor_id').addEventListener('change', async function() {
    const vendedorId = this.value;
    const vendedorNombre = this.options[this.selectedIndex].text;
    
    console.log('=== DEBUGGING VENDEDOR ===');
    console.log('Vendedor seleccionado:', vendedorNombre);
    console.log('ID del vendedor:', vendedorId);
    console.log('Tipo del ID:', typeof vendedorId);
    
    if (!vendedorId) {
        console.log('No hay vendedor seleccionado');
        document.querySelector('#tabla-clientes tbody').innerHTML = '';
        return;
    }
    
    // Cargar clientes del vendedor con debugging detallado
    await cargarClientesConDebug(vendedorId);
    // También actualizar clientes disponibles
    await actualizarClientesDisponibles();
});

async function cargarClientesConDebug(vendedorId) {
    const tbody = document.querySelector('#tabla-clientes tbody');
    
    console.log('=== INICIANDO CARGA DE CLIENTES ===');
    console.log('Vendedor ID para consulta:', vendedorId);
    
    // Mostrar loading
    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Cargando...</td></tr>';

    try {
        const url = `/api/vendedores/${vendedorId}/clientes`;
        console.log('URL de consulta:', url);
        
        // Hacer la consulta
        const res = await fetch(url);
        
        console.log('Response status:', res.status);
        console.log('Response ok:', res.ok);
        
        if (!res.ok) {
            const errorText = await res.text();
            console.error('Error response:', errorText);
            throw new Error(`Error HTTP: ${res.status} - ${errorText}`);
        }
        
        const datos = await res.json();
        console.log('Datos recibidos:', datos);
        console.log('Tipo de datos:', typeof datos);
        console.log('Es array?', Array.isArray(datos));
        console.log('Cantidad de elementos:', datos.length);

        // Limpiar tabla
        tbody.innerHTML = '';

        if (!datos.length) {
            console.log('❌ No hay clientes asignados a este vendedor');
            tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Sin clientes asignados</td></tr>';
            
            // DEBUGGING ADICIONAL: Verificar todas las asignaciones
            await verificarTodasLasAsignaciones();
            return;
        }

        console.log(`✅ Encontrados ${datos.length} clientes asignados`);
        
        // Dibujar filas de clientes asignados
        datos.forEach((c, index) => {
            console.log(`Cliente ${index}:`, c);
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${c.nombre}</td>
              <td>
                 <button class="btn btn-sm btn-outline-danger" data-asign="${c.asign_id}" title="Desasignar cliente">
                     <i class="fas fa-unlink"></i> Desasignar
                 </button>
              </td>`;
            tbody.appendChild(tr);
        });
        
        console.log('=== CARGA COMPLETADA ===');
        
    } catch (error) {
        console.error('❌ Error al cargar clientes asignados:', error);
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Error al cargar datos</td></tr>';
    }
}

// Función para actualizar clientes disponibles
async function actualizarClientesDisponibles() {
    const clienteSelect = document.getElementById('cliente_id');
    
    console.log('=== ACTUALIZANDO CLIENTES DISPONIBLES ===');
    
    try {
        const res = await fetch('/api/clientes/sin-asignar');
        
        if (!res.ok) {
            throw new Error(`Error HTTP: ${res.status}`);
        }
        
        const clientes = await res.json();
        console.log('Clientes sin asignar:', clientes);

        // Limpiar select
        clienteSelect.innerHTML = '<option value="">— Seleccione —</option>';

        // Agregar opciones de clientes disponibles
        clientes.forEach(cliente => {
            const option = document.createElement('option');
            option.value = cliente.id;
            option.textContent = cliente.nombre;
            clienteSelect.appendChild(option);
        });
        
        console.log('=== CLIENTES DISPONIBLES ACTUALIZADOS ===');
        
    } catch (error) {
        console.error('Error al cargar clientes disponibles:', error);
        clienteSelect.innerHTML = '<option value="">Error al cargar clientes</option>';
    }
}

// Función adicional para debugging - verificar todas las asignaciones
async function verificarTodasLasAsignaciones() {
    console.log('=== VERIFICANDO TODAS LAS ASIGNACIONES ===');
    
    try {
        // Consultar todos los vendedores para ver cuáles tienen clientes
        const vendedorSelect = document.getElementById('vendedor_id');
        const vendedores = Array.from(vendedorSelect.options).slice(1); // Excluir el primer option vacío
        
        for (let option of vendedores) {
            if (option.value) {
                const url = `/api/vendedores/${option.value}/clientes`;
                const res = await fetch(url);
                if (res.ok) {
                    const clientes = await res.json();
                    console.log(`Vendedor ${option.text} (ID: ${option.value}): ${clientes.length} clientes`);
                }
            }
        }
    } catch (error) {
        console.error('Error verificando asignaciones:', error);
    }
}

// Listener para desasignar clientes
document.querySelector('#tabla-clientes').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-asign]');
    if (!btn) return;

    if (!confirm('¿Estás seguro de que quieres desasignar este cliente?')) return;

    // Deshabilitar botón durante la operación
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';

    try {
        const asignId = btn.dataset.asign;
        const resp = await fetch(`/api/asignaciones/${asignId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const json = await resp.json();

        if (json.success) {
            // Remover la fila
            btn.closest('tr').remove();
            
            // Actualizar clientes disponibles
            await actualizarClientesDisponibles();
            
            console.log('✅ Cliente desasignado correctamente');
        } else {
            console.error('❌ Error al desasignar:', json.error);
            alert('Error: ' + (json.error || 'No se pudo desasignar'));
            // Restaurar botón
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-unlink"></i> Desasignar';
        }
    } catch (error) {
        console.error('❌ Error de conexión al desasignar:', error);
        alert('Error de conexión al desasignar cliente');
        // Restaurar botón
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-unlink"></i> Desasignar';
    }
});

// Auto-ejecutar al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    console.log('=== PÁGINA CARGADA - DEBUGGING ACTIVADO ===');
    
    // Mostrar todos los vendedores disponibles
    const vendedorSelect = document.getElementById('vendedor_id');
    console.log('Vendedores disponibles:');
    Array.from(vendedorSelect.options).forEach((option, index) => {
        if (option.value) {
            console.log(`${index}: ${option.text} (ID: ${option.value})`);
        }
    });
    
    // Cargar clientes disponibles inicialmente
    actualizarClientesDisponibles();
});
</script>
{% endblock %}
