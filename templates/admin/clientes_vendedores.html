{% extends "base.html" %}
{% block title %}Asignar Cliente a Vendedor{% endblock %}

{% block content %}
<div class="card shadow-lg p-4 mx-auto" style="max-width:900px">
  <form id="form-asignar" method="POST" action="{{ url_for('asignar_cliente') }}" class="row g-3">
      <!-- ---------- Vendedor ---------- -->
      <div class="col-md-6">
          <label for="vendedor_id" class="form-label">Vendedor</label>
          <select id="vendedor_id" name="vendedor_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for v in vendedores %}
                  <option value="{{ v.id }}">{{ v.nombre_completo }}</option>
              {% endfor %}
          </select>
      </div>
      <!-- ---------- Cliente ---------- -->
      <div class="col-md-6">
          <label for="cliente_id" class="form-label">Cliente sin asignar</label>
          <select id="cliente_id" name="cliente_id" class="form-select" required>
              <option value="">— Seleccione —</option>
              {% for c in clientes_sin_asignar %}
                  <option value="{{ c.id }}">{{ c.nombre }}</option>
              {% endfor %}
          </select>
      </div>
      <div class="col-12">
        <button class="btn btn-primary w-100">
            <i class="fas fa-plus-circle"></i> Asignar
        </button>
      </div>
  </form>
  <!-- ===== Tabla dinámica de clientes del vendedor ===== -->
  <hr class="my-4">
  <h5>Clientes asignados</h5>
  <div class="table-responsive">
      <table id="tabla-clientes" class="table table-striped align-middle">
          <thead>
              <tr>
                  <th style="width:70%">Cliente</th>
                  <th style="width:30%">Acciones</th>
              </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
      </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
{{ super() }}
<!-- El script se ejecuta **después** de que el DOM está listo -->
<script defer>
// Sección JS envuelta en DOMContentLoaded para garantizar que el elemento exista
// y evitar que el addEventListener se ejecute demasiado pronto.

document.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 SCRIPT INICIADO – Versión 2.0 (DOMContentLoaded)');

  /* ------------------------------------------------------------------ */
  /*  Helper genérico para consultas Fetch                              */
  /* ------------------------------------------------------------------ */
  const fetchJSON = async (url, options = {}) => {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' }, ...options });
    if (!res.ok) throw new Error(`${res.status} – ${await res.text()}`);
    return res.json();
  };

  /* ------------------------------------------------------------------ */
  /*  Cargar clientes asignados al cambiar de vendedor                   */
  /* ------------------------------------------------------------------ */
  const vendedorSelect = document.getElementById('vendedor_id');

  // Compatibilidad si el select está potenciado con Bootstrap‑Select
  const SELECT_CHANGE_EVENT = 'changed.bs.select';
  vendedorSelect.addEventListener('change', cambioVendedor);
  vendedorSelect.addEventListener(SELECT_CHANGE_EVENT, cambioVendedor);

  async function cambioVendedor() {
    const vendedorId   = vendedorSelect.value;
    const vendedorName = vendedorSelect.options[vendedorSelect.selectedIndex]?.textContent;
    console.log('👉 Cambio de vendedor:', { vendedorId, vendedorName });

    // Limpiar tabla si no hay vendedor
    if (!vendedorId) return pintarSinClientes();

    try {
      const datos = await fetchJSON(`/api/vendedores/${vendedorId}/clientes`);
      pintarClientes(datos);
    } catch (err) {
      console.error('Error obteniendo clientes:', err);
      pintarError();
    }

    // Actualizar listado de clientes disponibles en paralelo
    actualizarClientesDisponibles();
  }

  /* ------------------------------------------------------------------ */
  /*  Pintar tabla                                                      */
  /* ------------------------------------------------------------------ */
  const tbody = document.querySelector('#tabla-clientes tbody');
  const pintarSinClientes = () => {
    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Sin clientes asignados</td></tr>';
  };
  const pintarError = () => {
    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Error al cargar datos</td></tr>';
  };
  function pintarClientes(datos = []) {
    tbody.innerHTML = '';
    if (!Array.isArray(datos) || !datos.length) return pintarSinClientes();
    datos.forEach(({ nombre, asign_id }) => {
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td>${nombre}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" data-asign="${asign_id}">
              <i class="fas fa-unlink"></i> Desasignar
            </button>
          </td>
        </tr>`);
    });
  }

  /* ------------------------------------------------------------------ */
  /* Actualizar select de clientes disponibles                           */
  /* ------------------------------------------------------------------ */
  const clienteSelect = document.getElementById('cliente_id');
  async function actualizarClientesDisponibles() {
    try {
      const clientes = await fetchJSON('/api/clientes/sin-asignar');
      clienteSelect.innerHTML = '<option value="">— Seleccione —</option>';
      clientes.forEach(({ id, nombre }) => {
        clienteSelect.insertAdjacentHTML('beforeend', `<option value="${id}">${nombre}</option>`);
      });
    } catch (err) {
      console.error('Error obteniendo clientes sin asignar:', err);
      clienteSelect.innerHTML = '<option value="">Error al cargar clientes</option>';
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Desasignar cliente                                                */
  /* ------------------------------------------------------------------ */
  document.querySelector('#tabla-clientes').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-asign]');
    if (!btn) return;
    if (!confirm('¿Desasignar este cliente?')) return;
    try {
      await fetchJSON(`/api/asignaciones/${btn.dataset.asign}`, { method: 'DELETE' });
      console.log('Cliente desasignado');
      cambioVendedor(); // recargar lista del vendedor actual
    } catch (err) {
      alert('Error al desasignar');
    }
  });

  /* ------------------------------------------------------------------ */
  /*  Asignar cliente                                                   */
  /* ------------------------------------------------------------------ */
  document.getElementById('form-asignar').addEventListener('submit', async e => {
    e.preventDefault();
    const vendedorId = vendedorSelect.value;
    const clienteId  = clienteSelect.value;
    if (!vendedorId || !clienteId) return alert('Selecciona vendedor y cliente');
    try {
      await fetchJSON('/api/asignaciones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vendedor_id: +vendedorId, cliente_id: +clienteId })
      });
      console.log('Cliente asignado');
      clienteSelect.value = '';
      cambioVendedor(); // recargar lista
    } catch (err) {
      alert('Error al asignar cliente');
    }
  });

  // Inicializar página
  actualizarClientesDisponibles();
});
</script>
{% endblock %}
