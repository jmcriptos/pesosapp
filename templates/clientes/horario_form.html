<!-- templates/clientes/horario_form.html -->
{% extends "base.html" %}

{% block title %}Nuevo Horario - {{ cliente.nombre }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-clock"></i> 
                        Nuevo Horario para {{ cliente.nombre }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" id="horarioForm">
                        <div class="mb-3">
                            <label for="dia_semana" class="form-label">
                                Día de la Semana <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="dia_semana" name="dia_semana" required>
                                <option value="">Seleccionar día...</option>
                                <option value="lunes">Lunes</option>
                                <option value="martes">Martes</option>
                                <option value="miercoles">Miércoles</option>
                                <option value="jueves">Jueves</option>
                                <option value="viernes">Viernes</option>
                                <option value="sabado">Sábado</option>
                                <option value="domingo">Domingo</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="hora_apertura" class="form-label">
                                    Hora de Apertura <span class="text-danger">*</span>
                                </label>
                                <input type="time" class="form-control" id="hora_apertura" 
                                       name="hora_apertura" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="hora_cierre" class="form-label">
                                    Hora de Cierre <span class="text-danger">*</span>
                                </label>
                                <input type="time" class="form-control" id="hora_cierre" 
                                       name="hora_cierre" required>
                            </div>
                        </div>

                        <div class="card bg-light mb-3">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-utensils"></i> Horario de Almuerzo (Opcional)
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="hora_inicio_almuerzo" class="form-label">
                                            Inicio de Almuerzo
                                        </label>
                                        <input type="time" class="form-control" 
                                               id="hora_inicio_almuerzo" name="hora_inicio_almuerzo">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="hora_fin_almuerzo" class="form-label">
                                            Fin de Almuerzo
                                        </label>
                                        <input type="time" class="form-control" 
                                               id="hora_fin_almuerzo" name="hora_fin_almuerzo">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" 
                                       id="es_horario_especial" name="es_horario_especial">
                                <label class="form-check-label" for="es_horario_especial">
                                    <strong>Horario Especial</strong>
                                    <br>
                                    <small class="text-muted">
                                        Marcar si es un horario temporal o especial
                                    </small>
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notas" class="form-label">Notas</label>
                            <textarea class="form-control" id="notas" name="notas" rows="2"
                                      placeholder="Ej: Solo durante temporada alta, horario de verano, etc."></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('ver_contactos_cliente', cliente_id=cliente.id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-info text-white">
                                <i class="fas fa-save"></i> Guardar Horario
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Vista previa del horario -->
            <div class="card mt-3">
                <div class="card-body">
                    <h6 class="card-title">Vista Previa del Horario</h6>
                    <div id="horarioPreview" class="text-muted">
                        <i class="fas fa-info-circle"></i> 
                        Complete el formulario para ver la vista previa
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Actualizar vista previa
function updatePreview() {
    const dia = document.getElementById('dia_semana').value;
    const apertura = document.getElementById('hora_apertura').value;
    const cierre = document.getElementById('hora_cierre').value;
    const almuerzoInicio = document.getElementById('hora_inicio_almuerzo').value;
    const almuerzoFin = document.getElementById('hora_fin_almuerzo').value;
    const especial = document.getElementById('es_horario_especial').checked;
    
    if (dia && apertura && cierre) {
        let preview = `<strong>${dia.charAt(0).toUpperCase() + dia.slice(1)}:</strong> ${apertura} - ${cierre}`;
        
        if (almuerzoInicio && almuerzoFin) {
            preview += ` (Almuerzo: ${almuerzoInicio} - ${almuerzoFin})`;
        }
        
        if (especial) {
            preview += ' <span class="badge bg-warning text-dark ms-2">Horario Especial</span>';
        }
        
        document.getElementById('horarioPreview').innerHTML = preview;
    }
}

// Agregar listeners
document.getElementById('dia_semana').addEventListener('change', updatePreview);
document.getElementById('hora_apertura').addEventListener('change', updatePreview);
document.getElementById('hora_cierre').addEventListener('change', updatePreview);
document.getElementById('hora_inicio_almuerzo').addEventListener('change', updatePreview);
document.getElementById('hora_fin_almuerzo').addEventListener('change', updatePreview);
document.getElementById('es_horario_especial').addEventListener('change', updatePreview);

// Validación del formulario
document.getElementById('horarioForm').addEventListener('submit', function(e) {
    const apertura = document.getElementById('hora_apertura').value;
    const cierre = document.getElementById('hora_cierre').value;
    const almuerzoInicio = document.getElementById('hora_inicio_almuerzo').value;
    const almuerzoFin = document.getElementById('hora_fin_almuerzo').value;
    
    // Validar que la hora de cierre sea posterior a la de apertura
    if (apertura >= cierre) {
        e.preventDefault();
        alert('La hora de cierre debe ser posterior a la hora de apertura');
        return false;
    }
    
    // Validar horario de almuerzo si se proporciona
    if (almuerzoInicio || almuerzoFin) {
        if (!almuerzoInicio || !almuerzoFin) {
            e.preventDefault();
            alert('Debe especificar tanto el inicio como el fin del almuerzo');
            return false;
        }
        
        if (almuerzoInicio >= almuerzoFin) {
            e.preventDefault();
            alert('La hora de fin de almuerzo debe ser posterior a la de inicio');
            return false;
        }
        
        if (almuerzoInicio <= apertura || almuerzoFin >= cierre) {
            e.preventDefault();
            alert('El horario de almuerzo debe estar dentro del horario de apertura');
            return false;
        }
    }
});
</script>
{% endblock %}
