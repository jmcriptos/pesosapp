<!-- templates/clientes/contacto_form.html -->
{% extends "base.html" %}

{% block title %}Nuevo Contacto - {{ cliente.nombre }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-plus"></i> 
                        Nuevo Contacto para {{ cliente.nombre }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" id="contactoForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre_completo" class="form-label">
                                    Nombre Completo <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="nombre_completo" 
                                       name="nombre_completo" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cargo_posicion" class="form-label">Cargo/Posición</label>
                                <input type="text" class="form-control" id="cargo_posicion" 
                                       name="cargo_posicion" placeholder="Ej: Gerente de Compras">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono">
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="extension" class="form-label">Ext.</label>
                                <input type="text" class="form-control" id="extension" 
                                       name="extension" maxlength="10">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="celular" class="form-label">Celular</label>
                                <input type="tel" class="form-control" id="celular" name="celular">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="mejor_horario_contacto" class="form-label">
                                    Mejor Horario de Contacto
                                </label>
                                <select class="form-select" id="mejor_horario_contacto" 
                                        name="mejor_horario_contacto">
                                    <option value="">Seleccionar...</option>
                                    <option value="Mañanas (8-12)">Mañanas (8-12)</option>
                                    <option value="Mediodía (12-14)">Mediodía (12-14)</option>
                                    <option value="Tardes (14-18)">Tardes (14-18)</option>
                                    <option value="Noches (18-20)">Noches (18-20)</option>
                                    <option value="Cualquier hora">Cualquier hora</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nivel_influencia" class="form-label">
                                    Nivel de Influencia en Decisiones
                                </label>
                                <input type="range" class="form-range" id="nivel_influencia" 
                                       name="nivel_influencia" min="1" max="10" value="5"
                                       oninput="updateInfluenceValue(this.value)">
                                <small class="text-muted">
                                    Nivel: <span id="influenceValue">5</span>/10
                                </small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check form-switch pt-4">
                                    <input class="form-check-input" type="checkbox" 
                                           id="es_contacto_principal" name="es_contacto_principal">
                                    <label class="form-check-label" for="es_contacto_principal">
                                        <strong>Contacto Principal</strong>
                                        <br>
                                        <small class="text-muted">
                                            Marcar si es el contacto principal para este cliente
                                        </small>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notas" class="form-label">Notas Adicionales</label>
                            <textarea class="form-control" id="notas" name="notas" rows="3"
                                      placeholder="Información adicional sobre este contacto..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('ver_contactos_cliente', cliente_id=cliente.id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar Contacto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* --- 1) Mantén esta función para el slider --- */
function updateInfluenceValue(value) {
  document.getElementById('influenceValue').textContent = value;
}

/* --- 2) Nuevo manejador submit con validación + fetch --- */
document.getElementById('contactoForm').addEventListener('submit', async (e) => {
  e.preventDefault();                       // evita recarga
  /* ---------- validaciones existentes ---------- */
  const nombre   = document.getElementById('nombre_completo').value.trim();
  const email    = document.getElementById('email').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const celular  = document.getElementById('celular').value.trim();

  if (!nombre) {
    alert('El nombre completo es obligatorio');
    return;
  }
  if (!email && !telefono && !celular) {
    alert('Debe proporcionar al menos un método de contacto (email, teléfono o celular)');
    return;
  }

  /* ---------- armar payload ---------- */
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  data.es_contacto_principal = !!data.es_contacto_principal; // checkbox → boolean
  data.nivel_influencia     = Number(data.nivel_influencia); // slider

  /* ---------- llamada Ajax ---------- */
  const clienteId = {{ cliente.id }}; // Jinja inyecta el ID numérico
  try {
    const res  = await fetch(`/crm/clientes/${clienteId}/contactos`, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify(data)
    });
    const json = await res.json();

    if (res.ok) {
      // Redirige a la lista de contactos o muestra mensaje
      window.location.href = "{{ url_for('ver_contactos_cliente', cliente_id=cliente.id) }}";
    } else {
      alert(json.error || 'Error inesperado');
    }
  } catch (err) {
    console.error(err);
    alert('No se pudo conectar con el servidor');
  }
});
</script>

{% endblock %}
