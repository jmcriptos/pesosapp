{% extends "base.html" %}
{% block title %}Editar Cliente{% endblock %}

{% block content %}
<div class="form-section">
    <h2>Editar Cliente</h2>
    <form method="POST">
        {{ csrf_token() }}
        <div class="form-group">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" value="{{ cliente.nombre }}" required class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">QBO ID:</label>
            <input type="text" name="qbo_id" value="{{ cliente.qbo_id }}" class="form-input">
        </div>
        <button type="submit" class="form-button">
            <i class="fas fa-save"></i> Guardar
        </button>
        <a href="{{ url_for('mostrar_clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
