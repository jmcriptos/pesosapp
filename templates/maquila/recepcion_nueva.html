{% extends "maquila/base_maquila.html" %}
{#- Una línea de ingrediente. La misma pieza sirve para el <template> que
    clona el JS (sin valores) y para re-pintar lo tecleado cuando el servidor
    rechazó el envío (con `l`), para que nada se pierda. -#}
{% macro linea(ingredientes, l=None) -%}
  <div class="rec-linea">
    <div class="rec-linea-campo">
      <label>Ingrediente
        <select name="linea_ingrediente_id" required>
          {% for i in ingredientes %}<option value="{{ i.id }}" {{ 'selected' if l and l.ingrediente_id == i.id else '' }}>{{ i.nombre }} ({{ i.unidad }})</option>{% endfor %}
        </select>
      </label>
    </div>
    <div class="rec-linea-campo">
      <label>Lote del cliente
        <input type="text" name="linea_lote_cliente" placeholder="Opcional" autocomplete="off" autocapitalize="characters" value="{{ l.lote_cliente or '' if l else '' }}">
      </label>
    </div>
    <div class="rec-linea-campo">
      <label>Vencimiento
        <input type="date" name="linea_fecha_vencimiento" value="{{ l.fecha_vencimiento.strftime('%Y-%m-%d') if l and l.fecha_vencimiento else '' }}">
      </label>
    </div>
    <div class="rec-linea-campo">
      <label>Bultos
        <input type="number" step="1" min="0" name="linea_cantidad_bultos" inputmode="numeric" placeholder="Cuántos" value="{{ l.cantidad_bultos or '' if l else '' }}">
      </label>
    </div>
    <div class="rec-linea-campo">
      <label>Peso total
        <input type="number" step="0.001" min="0.001" name="linea_peso_total" inputmode="decimal" placeholder="De la balanza" required value="{{ l.peso_total if l and l.peso_total is not none else '' }}">
      </label>
    </div>
    <button type="button" class="btn rec-quitar-btn" data-rec-quitar aria-label="Quitar esta línea">Quitar</button>
  </div>
{%- endmacro %}
{% block title %}Nueva recepción{% endblock %}
{% block maquila_title %}Nueva recepción{% endblock %}
{% block maquila_body %}
<form method="POST" enctype="multipart/form-data" class="ops-sheet-form" id="rec-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <section class="ops-card">
    <h2>Recepción</h2>
    <p class="maquila-nota">Lo que se registra acá entra al inventario del cliente y queda a su nombre. El cliente no tiene valor por defecto a propósito: una recepción cargada al cliente equivocado es carne ajena en la cuenta de otro.</p>
    <div class="ops-field">
      <label for="cliente_id">Cliente</label>
      <select id="cliente_id" name="cliente_id" required>
        {% set cli_sel = (form.get('cliente_id')|int) if form.get('cliente_id') and form.get('cliente_id').isdigit() else cliente_sugerido %}
        <option value="" disabled {{ 'selected' if not cli_sel else '' }}>Elegí un cliente</option>
        {% for c in clientes %}<option value="{{ c.id }}" {{ 'selected' if cli_sel == c.id else '' }}>{{ c.nombre }}</option>{% endfor %}
      </select>
    </div>
    <div class="ops-field">
      <label for="recibido_en">Fecha</label>
      <input type="date" id="recibido_en" name="recibido_en" required value="{{ form.get('recibido_en') or (hoy.strftime('%Y-%m-%d') if hoy else '') }}">
    </div>
  </section>

  <section class="ops-card">
    <h2>Ingredientes</h2>
    <p class="maquila-nota">Una línea por ingrediente. «Bultos» es cuántos paquetes llegaron; «Peso total» es lo que marcó la balanza para toda la línea. Son dos números independientes.</p>
    <div id="rec-lineas">{% for l in lineas_previas %}{{ linea(ingredientes, l) }}{% endfor %}</div>
    <div class="maquila-acciones">
      <button type="button" class="btn" id="rec-add-linea">Agregar otro ingrediente</button>
    </div>
  </section>

  {#- Lo que no hace falta para pesar va después de las líneas y plegado en
      el teléfono: con la carne en la balanza, el primer «Peso total» tiene
      que estar a un scroll, no a tres. -#}
  <details class="ops-card maquila-detalles" id="mas-datos" open>
    <summary>Más datos de la entrega <span class="maquila-meta">documento, temperatura, transportista, notas</span></summary>
    <div class="ops-field">
      <label for="documento_cliente">Documento del cliente <small>(opcional)</small></label>
      <input type="text" id="documento_cliente" name="documento_cliente" autocomplete="off"
             placeholder="Guía o remisión, si la mandaron" value="{{ form.get('documento_cliente', '') }}">
    </div>
    <div class="ops-field">
      <label for="temperatura">Temperatura °C <small>(opcional)</small></label>
      <input type="number" step="0.1" inputmode="decimal" id="temperatura" name="temperatura" placeholder="Al recibir, por ejemplo -18.0" value="{{ form.get('temperatura', '') }}">
    </div>
    <div class="ops-field">
      <label for="transportista">Transportista <small>(opcional)</small></label>
      <input type="text" id="transportista" name="transportista" autocomplete="off" value="{{ form.get('transportista', '') }}">
    </div>
    <div class="ops-field">
      <label for="notas">Notas <small>(opcional)</small></label>
      <textarea id="notas" name="notas" rows="2">{{ form.get('notas', '') }}</textarea>
    </div>
  </details>

  <section class="ops-card">
    <h2>Evidencia</h2>
    <div class="ops-field">
      <label for="fotos">Fotos <small>(opcional)</small></label>
      <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
    </div>
    <div class="ops-firma-label" id="firmaLabel">Firma de quien entrega</div>
    <!-- El botón de borrar va DENTRO del pad: `.ops-firma-clear` es
         `position:absolute` y `.ops-firma-pad` es su `position:relative`. Como
         hermano posterior se resolvía contra un ancestro muy superior y
         terminaba en top:8px/left:277px, debajo de la topbar de la app:
         elementFromPoint devolvía la campana de notificaciones y era imposible
         corregir una firma sin recargar y perder el formulario entero. -->
    <div class="ops-firma-pad" id="firmaPad-wrap">
      <canvas id="firmaPad" width="600" height="200"
              role="img" aria-labelledby="firmaLabel"
              aria-describedby="firmaAyuda"></canvas>
      <div class="ops-firma-placeholder" id="firmaPlaceholder">Firmá acá con el dedo</div>
      <button type="button" class="ops-firma-clear" id="firmaClear">Borrar firma</button>
    </div>
    <p class="maquila-firma-ayuda" id="firmaAyuda">
      Si quien entrega no puede firmar en pantalla, dejalo escrito en las notas y guardá la recepción sin firma.
    </p>
    <input type="hidden" name="firma_png" id="firma_png">
  </section>

  <footer class="ops-sticky-footer">
    <button type="submit" class="btn btn-primary" id="rec-submit-btn">Guardar recepción</button>
  </footer>
</form>

<template id="rec-linea-tpl">
  {{ linea(ingredientes) }}
</template>

<script nonce="{{ csp_nonce() }}">
(function () {
  var cont = document.getElementById('rec-lineas');
  var tpl = document.getElementById('rec-linea-tpl');
  function addLinea() { cont.appendChild(tpl.content.cloneNode(true)); }
  document.getElementById('rec-add-linea').addEventListener('click', addLinea);
  // Si el servidor devolvió el formulario con líneas tecleadas, se respetan.
  if (!cont.querySelector('.rec-linea')) addLinea();

  // En el teléfono, los datos secundarios arrancan plegados.
  var masDatos = document.getElementById('mas-datos');
  if (masDatos && window.innerWidth < 768) masDatos.open = false;

  // Quitar una línea agregada de más. Siempre queda al menos una: una
  // recepción sin líneas no existe, y el servidor lo rechaza igual. Con una
  // sola línea el botón se deshabilita en vez de no hacer nada en silencio.
  function refrescarQuitar() {
    var botones = cont.querySelectorAll('[data-rec-quitar]');
    var sola = botones.length <= 1;
    botones.forEach(function (b) { b.disabled = sola; b.setAttribute('aria-disabled', sola ? 'true' : 'false'); });
  }
  cont.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-rec-quitar]');
    if (!btn || btn.disabled) return;
    btn.closest('.rec-linea').remove();
    refrescarQuitar();
  });
  document.getElementById('rec-add-linea').addEventListener('click', refrescarQuitar);
  refrescarQuitar();

  // Color FIJO: los tokens claros están scopeados a .ops-*, así que leerlos de
  // document.body devuelve el token OSCURO y la firma sale blanca sobre blanco.
  var TINTA = '#0f172a';
  var canvas = document.getElementById('firmaPad');
  var ctx = canvas.getContext('2d');
  var dibujando = false, hayFirma = false;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = TINTA;

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * canvas.width / r.width,
             y: (p.clientY - r.top) * canvas.height / r.height };
  }
  var padWrap = document.getElementById('firmaPad-wrap');
  var placeholder = document.getElementById('firmaPlaceholder');

  function marcarFirmada(si) {
    // `.has-sign` pinta el borde del pad en verde sólido: es la ÚNICA
    // confirmación de que el trazo se capturó. operaciones.css ya la traía y
    // el módulo nunca la aplicaba.
    hayFirma = si;
    padWrap.classList.toggle('has-sign', si);
    placeholder.hidden = si;
  }

  function start(e) { dibujando = true; marcarFirmada(true); var q = pos(e);
                      ctx.beginPath(); ctx.moveTo(q.x, q.y); e.preventDefault(); }
  function move(e) { if (!dibujando) return; var q = pos(e);
                     ctx.lineTo(q.x, q.y); ctx.stroke(); e.preventDefault(); }
  function end() { dibujando = false; }

  ['mousedown', 'touchstart'].forEach(function (ev) { canvas.addEventListener(ev, start); });
  ['mousemove', 'touchmove'].forEach(function (ev) { canvas.addEventListener(ev, move); });
  ['mouseup', 'mouseleave', 'touchend'].forEach(function (ev) { canvas.addEventListener(ev, end); });

  document.getElementById('firmaClear').addEventListener('click', function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    marcarFirmada(false);
  });

  // Bandera compartida: mientras haya reducciones de foto en curso, el botón
  // de guardar queda deshabilitado (abajo) Y el submit se corta acá también,
  // por si un Enter en un campo de texto dispara el envío sin pasar por el
  // click del botón.
  var reduccionesPendientes = 0;

  document.getElementById('rec-form').addEventListener('submit', function (e) {
    if (reduccionesPendientes > 0) {
      e.preventDefault();
      return;
    }
    if (hayFirma) document.getElementById('firma_png').value = canvas.toDataURL('image/png');
  });

  // Reducir las fotos antes de subir: cuatro imágenes de iPhone en crudo
  // hinchan la fila y la memoria del dyno. Mientras dura, el botón lo DICE:
  // un botón deshabilitado sin texto se ve como una app colgada.
  var input = document.getElementById('fotos');
  var submitBtn = document.getElementById('rec-submit-btn');
  var textoGuardar = submitBtn ? submitBtn.textContent : '';
  input.addEventListener('change', function () {
    var dt = new DataTransfer();
    var pendientes = input.files.length;
    if (!pendientes) return;

    reduccionesPendientes += pendientes;
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Preparando fotos…'; }

    function terminarUna() {
      reduccionesPendientes--;
      if (--pendientes === 0) {
        input.files = dt.files;
      }
      if (reduccionesPendientes <= 0 && submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = textoGuardar;
      }
    }

    Array.prototype.forEach.call(input.files, function (file) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1280;
        var escala = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          // Si el navegador no pudo generar el blob reducido, se sube el
          // archivo original antes que perder la foto.
          dt.items.add(blob
            ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' })
            : file);
          terminarUna();
        }, 'image/jpeg', 0.8);
      };
      // Si UNA foto falla al cargar (archivo corrupto, formato raro), no se
      // puede dejar que el contador nunca llegue a cero: eso bloquearía el
      // swap de `input.files` para TODO el lote y las demás fotos, ya
      // reducidas, se subirían igual en crudo. Se sube esta foto tal cual y
      // se sigue con las demás.
      img.onerror = function () {
        URL.revokeObjectURL(url);
        dt.items.add(file);
        terminarUna();
      };
      img.src = url;
    });
  });
})();
</script>
{% endblock %}
