{% if estado in ['pendiente', 'preparado'] %}
<div class="action-bar">
  {% if tiene_productos_pesables and estado != 'facturado' %}
    <a href="{{ url_for('pesar_pedido', pedido_id=pedido.id) }}" class="btn-secondary"
       style="display:grid; place-items:center; text-decoration:none; white-space:nowrap;">
      <i class="fas fa-weight-hanging"></i> Pesar
    </a>
  {% endif %}
  {% if estado == 'pendiente' %}
    <form method="post"
          action="{{ url_for('marcar_preparado', pedido_id=pedido.id) }}"
          data-confirm="¿Marcar este pedido como preparado? Se validará la trazabilidad de todos los productos."
          style="flex:1;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn-primary" style="width:100%;">
        <i class="fas fa-check-circle"></i> Marcar preparado
      </button>
    </form>
  {% elif estado == 'preparado' %}
    <form method="post"
          action="{{ url_for('facturar_pedido', pedido_id=pedido.id) }}"
          style="flex:1;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn-primary" style="width:100%;">
        <i class="fas fa-file-invoice"></i> Facturar
      </button>
    </form>
  {% endif %}
</div>
{% endif %}
