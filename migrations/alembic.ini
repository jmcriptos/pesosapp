[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# La ubicación de los scripts de migración
script_location = migrations

# Puedes dejar el sqlalchemy.url vacío o con un placeholder,
# ya que se sobreescribirá en env.py usando la variable de entorno DATABASE_URL.
sqlalchemy.url = 

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

